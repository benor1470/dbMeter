# Generated by gen.py - table-size scaling benchmark on InMemory.Net IRDB (data copied from PostgreSQL).
driver.jar=../../build/irdb-jdbc.jar, ../../drivers/jirdb-2025-02-02.jar, ../../drivers/fastutil-8.5.15.jar
jdbc.url=jdbc:irdb://${env:IRDB_HOST:-localhost}:${env:IRDB_PORT:-5060}/size_bench
jdbc.user=${env:IRDB_USER:-default}
jdbc.password=${env:IRDB_PASSWORD:-!TopSecret}

# ---- 100 rows ----
check.s100_a_pk.sql=SELECT id, grp, val, name FROM t_100 WHERE id = 100
check.s100_a_pk.expect.csv=expected/s100_pk.csv
check.s100_b_filter.sql=SELECT id, val FROM t_100 WHERE grp = 3 AND val > 990000 ORDER BY id
check.s100_b_filter.expect.csv=expected/s100_filter.csv
check.s100_b_filter.expect.ordered=true
check.s100_c_topn.sql=SELECT id, val FROM t_100 ORDER BY val DESC LIMIT 10
check.s100_c_topn.expect.csv=expected/s100_topn.csv
check.s100_c_topn.expect.ordered=true
check.s100_d_last.sql=SELECT id FROM t_100 ORDER BY id DESC LIMIT 1
check.s100_d_last.expect.value=100
scenario.s100_pk.sql=SELECT id, grp, val, name FROM t_100 WHERE id = :{$rand(1,100):int}
scenario.s100_filter.sql=SELECT id, val FROM t_100 WHERE grp = :{$rand(0,9):int} AND val > 990000
scenario.s100_topn.sql=SELECT id, val FROM t_100 ORDER BY val DESC LIMIT 10
scenario.s100_fetch_all.sql=SELECT id, grp, val, name FROM t_100

