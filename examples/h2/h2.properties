# Self-contained example against an in-memory H2 database.
#   dbmeter info  -c examples/h2/h2.properties
#   dbmeter check -c examples/h2/h2.properties
#   dbmeter load  -c examples/h2/h2.properties
# Relative paths resolve against this file's directory. Use forward slashes in paths.

# ---- connection ----
driver.jar=../../drivers/h2-2.3.232.jar
jdbc.url=jdbc:h2:mem:dbmeter;DB_CLOSE_DELAY=-1
jdbc.user=sa
jdbc.password=
connection.testQuery=SELECT 1

# ---- load test ----
load.setup.file=sql/schema.sql
load.threads=8
load.rampUp=2s
load.warmup=3s
load.duration=10s
load.reportInterval=5s

scenario.lookup.file=sql/lookup_customer.sql
scenario.lookup.weight=6
scenario.lookup.params.file=data/customers.csv
scenario.lookup.params.mode=random

scenario.region_report.file=sql/region_report.sql
scenario.region_report.weight=1

scenario.place_order.file=sql/place_order.sql
scenario.place_order.weight=3

# ---- correctness checks ----
check.setup.file=sql/schema.sql

check.customer_count.sql=SELECT COUNT(*) FROM customers
check.customer_count.expect.value=100

check.region_report.file=sql/region_report.sql
check.region_report.expect.csv=expected/region_report.csv
check.region_report.expect.ordered=true
check.region_report.expect.maxMs=2000

check.lookup_one.file=sql/lookup_customer.sql
check.lookup_one.param.customer_id=7
check.lookup_one.expect.rows=1

check.missing_table_fails.sql=SELECT * FROM no_such_table
check.missing_table_fails.expect.error=not found

check.insert_is_rolled_back.sql=INSERT INTO customers VALUES (1000, 'Temp', 'north')
check.insert_is_rolled_back.expect.updateCount=1
check.insert_is_rolled_back.rollback=true

check.zz_still_100_customers.sql=SELECT COUNT(*) FROM customers
check.zz_still_100_customers.expect.value=100
