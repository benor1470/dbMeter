# PostgreSQL example. Set the password in the environment first:
#   PowerShell:  $env:PGPASSWORD = '...'
#   sh:          export PGPASSWORD=...
# Then:  dbmeter info -c examples/postgres/postgres.properties

driver.jar=../../drivers/postgresql-42.7.4.jar
jdbc.url=jdbc:postgresql://${env:PGHOST:-localhost}:${env:PGPORT:-5432}/${env:PGDATABASE:-postgres}
jdbc.user=${env:PGUSER:-postgres}
jdbc.password=${env:PGPASSWORD}
# Any other driver property: jdbc.prop.<name>=<value>
jdbc.prop.ApplicationName=dbmeter
jdbc.prop.reWriteBatchedInserts=true
connection.testQuery=SELECT version()
# Runs on every new connection:
connection.init.sql=SET search_path TO dbmeter_test, public

# ---- load test ----
# On a distributed run only one node should run setup: pass --skip-setup on the others.
load.setup.file=sql/schema.sql
load.threads=16
load.rampUp=5s
load.warmup=10s
load.duration=60s
load.queryTimeout=30s

scenario.lookup.file=sql/lookup_customer.sql
scenario.lookup.weight=6
scenario.lookup.params.file=../h2/data/customers.csv
scenario.lookup.params.mode=random

scenario.region_report.file=sql/region_report.sql
scenario.region_report.weight=1

scenario.place_order.file=sql/place_order.sql
scenario.place_order.weight=3

# ---- correctness checks ----
check.setup.file=sql/schema.sql

check.customer_count.sql=SELECT COUNT(*) FROM customers
check.customer_count.expect.value=100

check.region_report.file=sql/region_report.sql
check.region_report.expect.csv=../h2/expected/region_report.csv
check.region_report.expect.ordered=true
check.region_report.expect.maxMs=2000

check.function_works.sql=SELECT customer_total(7)
check.function_works.expect.rows=1
