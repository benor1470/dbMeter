# Sales aggregation in the SQL subset shared with RAMSQL, 1M sales rows (PostgreSQL). See gen.py.
#   python -I gen.py
#   dbmeter check -c examples/sales-agg-subset/pg.properties     (builds schema dbmeter_agg_subset)
#   dbmeter load  -c examples/sales-agg-subset/pg.properties
driver.jar=../../drivers/postgresql-42.7.4.jar
jdbc.url=jdbc:postgresql://${env:PGHOST:-localhost}:${env:PGPORT:-5432}/${env:PGDATABASE:-postgres}
jdbc.user=${env:PGUSER:-postgres}
jdbc.password=${env:PGPASSWORD:-1}
connection.init.sql=SET search_path TO dbmeter_agg_subset
check.setup.file=sql/pg_schema.sql

check.a_totals.sql=SELECT COUNT(*) AS row_count, SUM(amount_cents) AS revenue_cents FROM sales
check.a_totals.expect.csv=expected/totals.csv
check.s1_region.file=sql/s1_region.sql
check.s1_region.expect.csv=expected/s1_region.csv
check.s1_region.expect.ordered=true
check.s2_category.file=sql/s2_category.sql
check.s2_category.expect.csv=expected/s2_category.csv
check.s2_category.expect.ordered=true
check.s3_top_products.file=sql/s3_top_products.sql
check.s3_top_products.expect.csv=expected/s3_top_products.csv
check.s3_top_products.expect.ordered=true
check.s4_segment_discount.file=sql/s4_segment_discount.sql
check.s4_segment_discount.expect.csv=expected/s4_segment_discount.csv
check.s4_segment_discount.expect.ordered=true
check.s5_high_value_customers.file=sql/s5_high_value_customers.sql
check.s5_high_value_customers.expect.csv=expected/s5_high_value_customers.csv
check.s5_high_value_customers.expect.ordered=true
check.s6_store_category_mix.file=sql/s6_store_category_mix.sql
check.s6_store_category_mix.expect.csv=expected/s6_store_category_mix.csv
check.s6_store_category_mix.expect.ordered=true
check.s6_store_category_mix.param.store_id=17

# ---- load: same mix and weights as ../sales-agg ----
load.threads=8
load.rampUp=5s
load.warmup=15s
load.duration=60s
load.queryTimeout=120s
load.reportInterval=20s
scenario.s1_region.file=sql/s1_region.sql
scenario.s1_region.weight=2
scenario.s2_category.file=sql/s2_category.sql
scenario.s2_category.weight=1
scenario.s3_top_products.file=sql/s3_top_products.sql
scenario.s3_top_products.weight=2
scenario.s4_segment_discount.file=sql/s4_segment_discount.sql
scenario.s4_segment_discount.weight=2
scenario.s5_high_value_customers.file=sql/s5_high_value_customers.sql
scenario.s5_high_value_customers.weight=1
scenario.s6_store_category_mix.file=sql/s6_store_category_mix.sql
scenario.s6_store_category_mix.weight=4
scenario.s6_store_category_mix.params.file=data/stores.csv
scenario.s6_store_category_mix.params.mode=random
