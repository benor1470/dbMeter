# RAMSQL (https://github.com/SB0LTD/ramsql) through the stock PostgreSQL JDBC driver.
# Start the server:  tools/ramsql-bin/x64/ramsql-0.3.0-alpha.2-x86_64-windows/ramsql.exe --memory --insecure-local --port 5433
#   dbmeter check -c examples/ramsql/ramsql.properties
#   dbmeter load  -c examples/ramsql/ramsql.properties
# sql/schema.sql and expected/*.csv come from gen.py. RAMSQL has no joins or aggregates yet,
# so this workload is PK lookups, filtered scans, single-row writes and transactions.

driver.jar=../../drivers/postgresql-42.7.4.jar
jdbc.url=jdbc:postgresql://127.0.0.1:${env:RAMSQL_PORT:-5433}/ramsql
jdbc.user=postgres
jdbc.password=
jdbc.prop.sslmode=disable
# RAMSQL reports itself as PostgreSQL 16.0; name it correctly in reports.
run.databaseLabel=RAMSQL 0.3.0-alpha.2

# ---- correctness ----
check.setup.file=sql/schema.sql
# the initial DROP fails on a fresh server
check.setup.continueOnError=true

check.a_row_count.sql=SELECT id FROM items ORDER BY id
check.a_row_count.expect.rows=500

check.q_pk.file=sql/q_pk.sql
check.q_pk.param.id=123
check.q_pk.expect.csv=expected/q_pk.csv

check.q_scan.file=sql/q_scan.sql
check.q_scan.param.region=3
check.q_scan.param.min_price=5000
check.q_scan.expect.csv=expected/q_scan.csv
check.q_scan.expect.ordered=true

check.tx_rollback.sql=INSERT INTO items (id, region, price, qty, name) VALUES (9999, 1, 1, 1, 'temp')
check.tx_rollback.expect.updateCount=1
check.tx_rollback.rollback=true
check.tx_rollback_gone.sql=SELECT id FROM items WHERE id = 9999
check.tx_rollback_gone.expect.rows=0

# Documents the known gap: flips to FAIL once RAMSQL implements aggregates.
check.z_gap_aggregates.sql=SELECT COUNT(*) FROM items
check.z_gap_aggregates.expect.error=true

# ---- load (default profile allows 16 clients) ----
load.threads=8
load.rampUp=2s
load.warmup=5s
load.duration=30s

scenario.pk_lookup.file=sql/q_pk_rand.sql
scenario.pk_lookup.weight=6
scenario.filtered_scan.file=sql/q_scan.sql
scenario.filtered_scan.weight=3
scenario.filtered_scan.params.file=data/scan_params.csv
scenario.filtered_scan.params.mode=random
scenario.update_qty.file=sql/update_qty.sql
scenario.update_qty.weight=1
