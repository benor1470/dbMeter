# The sales-agg workload on InMemory.Net IRDB, through the dbmeter IRDB JDBC adapter.
#
# 1. Build (creates build/irdb-jdbc.jar when drivers/jirdb-*.jar is present):  ./build.ps1
# 2. Build the PostgreSQL data first (dbmeter check -c examples/sales-agg/postgres.properties),
#    then copy it into IRDB as database sales_agg:
#      java -cp "build/irdb-jdbc.jar;drivers/jirdb-2025-02-02.jar;drivers/fastutil-8.5.15.jar;drivers/postgresql-42.7.4.jar"
#           dbmeter.irdb.CopyToIrdb --source jdbc:postgresql://localhost:5432/postgres --source-user postgres
#           --source-password 1 --source-schema dbmeter_agg --target jdbc:irdb://localhost:5060/sales_agg
#           --tables regions,stores,categories,products,customers,sales
# 3. dbmeter check -c examples/sales-agg/irdb.properties
#    dbmeter load  -c examples/sales-agg/irdb.properties
#
# Same data and the same expected/*.csv as PostgreSQL; queries in sql-irdb/ differ only where the
# IRDB dialect requires (no ROLLUP, to_char, DATE literals or windows over CTE columns).

driver.jar=../../build/irdb-jdbc.jar, ../../drivers/jirdb-2025-02-02.jar, ../../drivers/fastutil-8.5.15.jar
jdbc.url=jdbc:irdb://${env:IRDB_HOST:-localhost}:${env:IRDB_PORT:-5060}/sales_agg
jdbc.user=${env:IRDB_USER:-default}
jdbc.password=${env:IRDB_PASSWORD:-!TopSecret}
connection.testQuery=SELECT COUNT(*) FROM sales

# ---- correctness ----
check.a_totals.sql=SELECT COUNT(*) AS row_count, SUM(amount_cents) AS revenue_cents FROM sales
check.a_totals.expect.csv=expected/totals.csv

check.q1_region_month.file=sql-irdb/q1_region_month.sql
check.q1_region_month.expect.csv=expected/q1_region_month.csv
check.q1_region_month.expect.ordered=true

check.q2_category_rank.file=sql/q2_category_rank.sql
check.q2_category_rank.expect.csv=expected/q2_category_rank.csv
check.q2_category_rank.expect.ordered=true

check.q3_top_products.file=sql-irdb/q3_top_products.sql
check.q3_top_products.expect.csv=expected/q3_top_products.csv
check.q3_top_products.expect.ordered=true

check.q4_segment_discount_rollup.file=sql-irdb/q4_segment_discount_rollup.sql
check.q4_segment_discount_rollup.expect.csv=expected/q4_segment_discount_rollup.csv

check.q5_high_value_customers.file=sql/q5_high_value_customers.sql
check.q5_high_value_customers.expect.csv=expected/q5_high_value_customers.csv
check.q5_high_value_customers.expect.ordered=true

check.q6_store_category_mix.file=sql-irdb/q6_store_category_mix.sql
check.q6_store_category_mix.param.store_id=17
check.q6_store_category_mix.expect.csv=expected/q6_store_category_mix.csv
check.q6_store_category_mix.expect.ordered=true

# ---- load ----
load.threads=8
load.rampUp=5s
load.warmup=15s
load.duration=60s
load.reportInterval=10s

scenario.q1_region_month.file=sql-irdb/q1_region_month.sql
scenario.q1_region_month.weight=2
scenario.q2_category_rank.file=sql/q2_category_rank.sql
scenario.q2_category_rank.weight=1
scenario.q3_top_products.file=sql-irdb/q3_top_products.sql
scenario.q3_top_products.weight=2
scenario.q4_segment_discount_rollup.file=sql-irdb/q4_segment_discount_rollup.sql
scenario.q4_segment_discount_rollup.weight=2
scenario.q5_high_value_customers.file=sql/q5_high_value_customers.sql
scenario.q5_high_value_customers.weight=1
scenario.q6_store_category_mix.file=sql-irdb/q6_store_category_mix.sql
scenario.q6_store_category_mix.weight=4
scenario.q6_store_category_mix.params.file=data/stores.csv
scenario.q6_store_category_mix.params.mode=random
