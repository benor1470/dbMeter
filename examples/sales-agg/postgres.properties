# Large-aggregation workload on a deterministic 5M-row sales star schema (PostgreSQL).
#
# 1. Build the data and validate correctness (setup takes ~30 s):
#      dbmeter check -c examples/sales-agg/postgres.properties
#    Re-check without rebuilding:   ... check --skip-setup
# 2. Load test the aggregations against the data built in step 1:
#      dbmeter load -c examples/sales-agg/postgres.properties
#
# expected/*.csv come from gen_expected.py, which recomputes every result in Python from the
# same formulas as sql/schema.sql - an independent implementation, not a copy of DB output.

driver.jar=../../drivers/postgresql-42.7.4.jar
jdbc.url=jdbc:postgresql://${env:PGHOST:-localhost}:${env:PGPORT:-5432}/${env:PGDATABASE:-postgres}
jdbc.user=${env:PGUSER:-postgres}
jdbc.password=${env:PGPASSWORD:-1}
jdbc.prop.ApplicationName=dbmeter-agg
connection.init.sql=SET search_path TO dbmeter_agg
connection.testQuery=SELECT COUNT(*) FROM dbmeter_agg.sales

# ---- correctness ----
check.setup.file=sql/schema.sql

check.a_totals.sql=SELECT COUNT(*) AS row_count, SUM(amount_cents) AS revenue_cents FROM sales
check.a_totals.expect.csv=expected/totals.csv

check.q1_region_month.file=sql/q1_region_month.sql
check.q1_region_month.expect.csv=expected/q1_region_month.csv
check.q1_region_month.expect.ordered=true

check.q2_category_rank.file=sql/q2_category_rank.sql
check.q2_category_rank.expect.csv=expected/q2_category_rank.csv
check.q2_category_rank.expect.ordered=true

check.q3_top_products.file=sql/q3_top_products.sql
check.q3_top_products.expect.csv=expected/q3_top_products.csv
check.q3_top_products.expect.ordered=true

check.q4_segment_discount_rollup.file=sql/q4_segment_discount_rollup.sql
check.q4_segment_discount_rollup.expect.csv=expected/q4_segment_discount_rollup.csv

check.q5_high_value_customers.file=sql/q5_high_value_customers.sql
check.q5_high_value_customers.expect.csv=expected/q5_high_value_customers.csv
check.q5_high_value_customers.expect.ordered=true

check.q6_store_category_mix.file=sql/q6_store_category_mix.sql
check.q6_store_category_mix.param.store_id=17
check.q6_store_category_mix.expect.csv=expected/q6_store_category_mix.csv
check.q6_store_category_mix.expect.ordered=true

# ---- load ----
load.threads=8
load.rampUp=5s
load.warmup=15s
load.duration=60s
load.queryTimeout=120s
load.reportInterval=10s

scenario.q1_region_month.file=sql/q1_region_month.sql
scenario.q1_region_month.weight=2
scenario.q2_category_rank.file=sql/q2_category_rank.sql
scenario.q2_category_rank.weight=1
scenario.q3_top_products.file=sql/q3_top_products.sql
scenario.q3_top_products.weight=2
scenario.q4_segment_discount_rollup.file=sql/q4_segment_discount_rollup.sql
scenario.q4_segment_discount_rollup.weight=2
scenario.q5_high_value_customers.file=sql/q5_high_value_customers.sql
scenario.q5_high_value_customers.weight=1
scenario.q6_store_category_mix.file=sql/q6_store_category_mix.sql
scenario.q6_store_category_mix.weight=4
scenario.q6_store_category_mix.params.file=data/stores.csv
scenario.q6_store_category_mix.params.mode=random
