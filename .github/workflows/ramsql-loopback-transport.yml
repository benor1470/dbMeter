name: RAMSQL indexed Linux loopback peer lookup
on:
  push:
    branches: [ci/loopback-indexed-ab-20261123]
permissions:
  actions: read
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        clients: [8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: loopback-probe
          path: .ci-runtime/hash-map
          run-id: 45219942496
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: loopback-probe
          path: .ci-runtime/indexed-map
          run-id: 45222269257
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ramsql-benchmark-binary
          path: .ci-runtime/downloaded-ramsql
          run-id: 45180837749
          github-token: ${{ github.token }}
      - name: Prepare the original JDBC workload and psql seed client
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          sys.path.insert(0, 'ci')
          from bootstrap import ROOT, RUNTIME, VERSIONS, download
          download(VERSIONS['postgres_jdbc'], ROOT / 'drivers/postgresql-42.7.4.jar')
          subprocess.run(['docker', 'pull', VERSIONS['postgres_image']], check=True)
          (RUNTIME / 'dependencies.json').write_text(json.dumps({'jdbc': VERSIONS['postgres_jdbc'],
              'seed_client': VERSIONS['postgres_image'], 'java': subprocess.check_output(
                  ['java', '-version'], stderr=subprocess.STDOUT, text=True)}))
          PY
          sh build.sh
      - name: Pair the same executable on the original million-row workload
        env:
          CLIENTS: ${{ matrix.clients }}
        run: |
          chmod 755 .ci-runtime/{hash,indexed}-map/tcp_loopback_probe
          python ci/benchmark_loopback_transport.py .ci-runtime/hash-map/tcp_loopback_probe .ci-runtime/indexed-map/tcp_loopback_probe "$CLIENTS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexed-loopback-paired-${{ matrix.clients }}-clients
          path: reports/live/size-scaling-1000000/
          if-no-files-found: warn
