name: RAMSQL bounded receive on Linux socket maps
on:
  push:
    branches: [ci/loopback-direct-receive-ab-20261123]
permissions:
  actions: read
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the exact bounded receive candidate
        run: python ci/bootstrap.py ramsql
      - name: Verify the live recv syscall and shared-worker poll fallback
        run: |
          source=$(find .ci-runtime/source -mindepth 1 -maxdepth 1 -type d)
          python "$source/tools/test_linux_direct_receive.py" --binary .ci-runtime/ramsql/bin/ramsql --report .ci-runtime/receive-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: ramsql-benchmark-binary
          path: |
            .ci-runtime/ramsql/bin/ramsql
            .ci-runtime/ramsql-provenance.json
            .ci-runtime/receive-proof.json
          if-no-files-found: error
  paired:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        clients: [1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: loopback-probe
          path: .ci-runtime/probe
          run-id: 45219942496
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ramsql-benchmark-binary
          path: .ci-runtime/downloaded-ramsql
      - name: Prepare the original JDBC workload and psql seed client
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          sys.path.insert(0, 'ci')
          from bootstrap import ROOT, RUNTIME, VERSIONS, download
          download(VERSIONS['postgres_jdbc'], ROOT / 'drivers/postgresql-42.7.4.jar')
          subprocess.run(['docker', 'pull', VERSIONS['postgres_image']], check=True)
          (RUNTIME / 'dependencies.json').write_text(json.dumps({'jdbc': VERSIONS['postgres_jdbc'],
              'seed_client': VERSIONS['postgres_image'], 'java': subprocess.check_output(
                  ['java', '-version'], stderr=subprocess.STDOUT, text=True)}))
          PY
          sh build.sh
      - name: Pair the same executable on the original million-row workload
        env:
          CLIENTS: ${{ matrix.clients }}
        run: |
          chmod 755 .ci-runtime/probe/tcp_loopback_probe
          python ci/benchmark_loopback_transport.py .ci-runtime/probe/tcp_loopback_probe "$CLIENTS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-receive-paired-${{ matrix.clients }}-clients
          path: reports/live/size-scaling-1000000/
          if-no-files-found: warn
