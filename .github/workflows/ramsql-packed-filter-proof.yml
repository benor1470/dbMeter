name: Original packed filter comparison

on:
  push:
    branches: [ci/ramsql-packed-filter-three-engines-20261118]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare pinned RAMSQL, reference servers and unchanged JDBC drivers
        env:
          IRDB_JDBC_PART_1: ${{ secrets.IRDB_JDBC_PART_1 }}
          IRDB_JDBC_PART_2: ${{ secrets.IRDB_JDBC_PART_2 }}
          IRDB_JDBC_PART_3: ${{ secrets.IRDB_JDBC_PART_3 }}
          IRDB_JDBC_PART_4: ${{ secrets.IRDB_JDBC_PART_4 }}
          IRDB_JDBC_PART_5: ${{ secrets.IRDB_JDBC_PART_5 }}
        run: |
          python -m unittest discover -s ci -p 'test_*.py'
          python ci/bootstrap.py ramsql
          python ci/bootstrap.py dependencies
          install -D .ci-runtime/ramsql/bin/ramsql .ci-runtime/downloaded-ramsql/ramsql/bin/ramsql
          cp .ci-runtime/ramsql-provenance.json .ci-runtime/downloaded-ramsql/
          sh build.sh
      - name: Compare original 1M filter at one and eight clients
        run: python ci/compare_packed_filter.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-original-packed-filter
          path: reports/live/size-scaling-1000000/
