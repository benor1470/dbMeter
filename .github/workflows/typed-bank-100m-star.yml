name: Typed bank 100M synchronous WAL and recovery

on:
  push:
    branches: [bench/ramsql-typed-bank-durable-cardinality-20261117]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-bank:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RAMSQL_SOURCE_REVISION: da0b68f1cf3cd6f64d2de2464f9d645b68fb1c31
      RAMSQL_SOURCE_SHA256: bc3b59fbd8a4b835b99635d8f049c09f4f80a94d02ff2b063841701d51c68f0a
      RAMSQL_FIXTURE_REVISION: bfdf49a4bf017f65d63590eb4aed0309d0874dce
      RAMSQL_FIXTURE_SHA256: 7112f0f063e02a5474f7e14aa4bb81ba354d60ef5ed5d27831c3def85b446c8b
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SB0LTD/ramsql
          ref: ${{ env.RAMSQL_SOURCE_REVISION }}
          path: product
      - uses: actions/checkout@v4
        with:
          repository: SB0LTD/ramsql
          ref: ${{ env.RAMSQL_FIXTURE_REVISION }}
          path: fixture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checksum-verified Sig release
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$RAMSQL_SOURCE_REVISION"
          test "$(git -C fixture rev-parse HEAD)" = "$RAMSQL_FIXTURE_REVISION"
          mkdir -p evidence
          source_archive="$RUNNER_TEMP/ramsql-$RAMSQL_SOURCE_REVISION.tar.gz"
          curl --fail --location --retry 3 "https://github.com/SB0LTD/ramsql/archive/$RAMSQL_SOURCE_REVISION.tar.gz" --output "$source_archive"
          printf '%s  %s\n' "$RAMSQL_SOURCE_SHA256" "$source_archive" | sha256sum --check --strict -
          fixture_archive="$RUNNER_TEMP/ramsql-$RAMSQL_FIXTURE_REVISION.tar.gz"
          curl --fail --location --retry 3 "https://github.com/SB0LTD/ramsql/archive/$RAMSQL_FIXTURE_REVISION.tar.gz" --output "$fixture_archive"
          printf '%s  %s\n' "$RAMSQL_FIXTURE_SHA256" "$fixture_archive" | sha256sum --check --strict -
          python product/tools/release_matrix.py --compiler-host "$RUNNER_OS/$RUNNER_ARCH" > evidence/compiler-release.json
          read -r tag asset expected < <(python -c 'import json; p=json.load(open("evidence/compiler-release.json")); print(p["tag"], p["asset"], p["sha256"])')
          archive="$RUNNER_TEMP/$asset"
          destination="$RUNNER_TEMP/sig-toolchain"
          curl --fail --location --retry 3 "https://github.com/SB0LTD/sig/releases/download/$tag/$asset" --output "$archive"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --strict -
          mkdir -p "$destination"
          tar -xf "$archive" -C "$destination"
          compiler="$(find "$destination" -type f -name sig -print -quit)"
          marker="$(find "$destination" -type f -path '*/lib/std/std.sig' -print -quit)"
          test -n "$compiler" && test -n "$marker"
          chmod +x "$compiler"
          echo "SIG=$compiler" >> "$GITHUB_ENV"
          echo "SIG_LIB_DIR=$(dirname "$(dirname "$marker")")" >> "$GITHUB_ENV"
      - name: Prepare the pinned runtime and build support
        run: python product/tools/prepare_sig_runtime.py --installed-lib "$SIG_LIB_DIR" --output "$RUNNER_TEMP/sig-runtime" --github-env "$GITHUB_ENV"
      - name: Build and identify the experimental binary
        run: |
          set -euo pipefail
          "$SIG" version | tee evidence/sig-version.txt
          (cd product; "$SIG" build -Doptimize=ReleaseSafe -Dintegral-version-banks=true) 2>&1 | tee evidence/build.txt
          install -m 755 product/sig-out/bin/ramsql evidence/ramsql
          sha256sum evidence/ramsql > evidence/SHA256SUMS
          cp "$SIG_RUNTIME_PREPARATION" evidence/runtime-preparation.json
          PYTHONPATH=product/tools python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from package_release import dependency_provenance

          path = Path("evidence")
          identity = {
              "product_revision": os.environ["RAMSQL_SOURCE_REVISION"],
              "product_archive_sha256": os.environ["RAMSQL_SOURCE_SHA256"],
              "fixture_revision": os.environ["RAMSQL_FIXTURE_REVISION"],
              "fixture_archive_sha256": os.environ["RAMSQL_FIXTURE_SHA256"],
              "fixture_sha256": hashlib.sha256(Path("fixture/tools/test_large_star_runtime.py").read_bytes()).hexdigest(),
              "persistence_fixture_sha256": hashlib.sha256(Path("fixture/tools/test_persistence.py").read_bytes()).hexdigest(),
              "workflow_revision": os.environ["GITHUB_SHA"],
              "workflow_repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "binary_sha256": hashlib.file_digest((path / "ramsql").open("rb"), "sha256").hexdigest(),
              "build_options": ["-Doptimize=ReleaseSafe", "-Dintegral-version-banks=true"],
              "zpm": dependency_provenance(),
              "scope": "100M six-word facts, two dimensions, two workers, synchronous WAL and abrupt process recovery",
          }
          (path / "provenance.json").write_text(json.dumps(identity, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Check replay cardinality and change-record validation
        run: |
          set -euo pipefail
          read -r zpm_url zpm_sha < <(python -c 'import json; z=json.load(open("evidence/provenance.json"))["zpm"]; print(z["archive"], z["sha256"])')
          zpm_archive="$RUNNER_TEMP/zpm-contract.tar.gz"
          zpm_root="$RUNNER_TEMP/zpm-contract"
          curl --fail --location --retry 3 "$zpm_url" --output "$zpm_archive"
          printf '%s  %s\n' "$zpm_sha" "$zpm_archive" | sha256sum --check --strict -
          mkdir -p "$zpm_root"
          tar --extract --gzip --file "$zpm_archive" --directory "$zpm_root" --strip-components=1
          "$SIG" build-exe --Sig-lib-dir "$SIG_LIB_DIR" -OReleaseSafe --dep sql \
            "-Mroot=$zpm_root/tests/test_sql_change_log.sig" "-Msql=$zpm_root/src/core/sql.sig" \
            "-femit-bin=$RUNNER_TEMP/sql-change-log"
          "$RUNNER_TEMP/sql-change-log" | tee evidence/change-log-contract.txt
      - name: Check the WAL, restart and joined query contracts on 262144 facts
        run: |
          set -euo pipefail
          python -m pip install -r product/tools/requirements-test.txt
          python product/tools/test_cli.py --binary evidence/ramsql --expect-integral-version-banks
          df -B1 "$RUNNER_TEMP" | tee evidence/wal-disk.txt
          python fixture/tools/test_large_star_runtime.py --binary evidence/ramsql \
            --rows 262144 --memory-budget 14347884288 --require-ordered-range \
            --wal "$RUNNER_TEMP/durable-star-smoke.wal" --report evidence/durable-smoke.json
      - name: Qualify 100M facts and recover from synchronous WAL
        run: |
          set -euo pipefail
          python fixture/tools/test_large_star_runtime.py --binary evidence/ramsql \
            --rows 100000000 --memory-budget 14347884288 --require-ordered-range \
            --wal "$RUNNER_TEMP/durable-star-100m.wal" --report evidence/typed-bank-100m-star.json
          sha256sum --check --strict evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typed-bank-durable-100m-evidence
          path: evidence/
          if-no-files-found: warn
