name: Original one-million-row lookup with RAMSQL indexed Linux loopback
on:
  push:
    branches: [ci/loopback-indexed-direct-one-20261123]
permissions:
  actions: read
  contents: read
jobs:
  primary-key:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        clients: [1]
    env:
      LOOKUP_CLIENTS: ${{ matrix.clients }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: ramsql-benchmark-binary
          path: .ci-runtime/downloaded-ramsql
          run-id: 45220765798
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: loopback-probe
          path: .ci-runtime/probe
          run-id: 45222269257
          github-token: ${{ github.token }}
      - name: Restore the supplied private IRDB Java client
        env:
          IRDB_JDBC_PART_1: ${{ secrets.IRDB_JDBC_PART_1 }}
          IRDB_JDBC_PART_2: ${{ secrets.IRDB_JDBC_PART_2 }}
          IRDB_JDBC_PART_3: ${{ secrets.IRDB_JDBC_PART_3 }}
          IRDB_JDBC_PART_4: ${{ secrets.IRDB_JDBC_PART_4 }}
          IRDB_JDBC_PART_5: ${{ secrets.IRDB_JDBC_PART_5 }}
        run: python ci/bootstrap.py dependencies
      - name: Build the unchanged dbMeter and IRDB adapter
        run: sh build.sh
      - name: Run the original JDBC case with the RAMSQL Linux loopback deployment
        run: |
          chmod 755 .ci-runtime/probe/tcp_loopback_probe
          echo 'RAMSQL uses the experimental Linux socket map for same-host peers only. PostgreSQL and IRDB use their original TCP deployment. The lookup scoring rules are unchanged.' >> "$GITHUB_STEP_SUMMARY"
          python ci/qualify_loopback_lookup.py .ci-runtime/probe/tcp_loopback_probe "$LOOKUP_CLIENTS"
      - name: Score the original case and publish all timing results
        if: always()
        run: python ci/evidence.py suite --suite size-scaling --size-partition 1000000 --lookup-clients "$LOOKUP_CLIENTS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-loopback-million-row-lookup-${{ matrix.clients }}-clients
          path: reports/live/size-scaling-1000000/
          if-no-files-found: error
          retention-days: 30
