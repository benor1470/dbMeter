name: Profile the idle-reactor change on one hosted runner
on:
  push:
    branches: [ci/idle-reactor-ab-20261124]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: ramsql-benchmark-binary
          run-id: 45457050567
          github-token: ${{ github.token }}
          path: .ci-runtime/downloaded-ramsql
      - name: Build the candidate's exact parent and prepare the original JDBC workload
        run: |
          set -euo pipefail
          python ci/bootstrap.py ramsql-baseline
          sh build.sh
      - name: Alternate the parent and candidate on plaintext TCP
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y linux-tools-generic
          packages=$(dpkg-query -W -f='${binary:Package}\n' 'linux-tools-[0-9]*')
          perf_binary=$(dpkg-query -L $packages | awk '/^\/usr\/lib\/.*\/perf$/ {print}' | sort -V | tail -n 1)
          test -x "$perf_binary"
          python ci/profile_prepared_pk.py "$perf_binary"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idle-reactor-baseline-candidate-profile
          path: reports/live/size-scaling-1000000/
          if-no-files-found: error
          retention-days: 30
