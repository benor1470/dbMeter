name: Qualify the original 100,000-row lookups on the published RAMSQL image
on:
  push:
    branches: [ci/published-100k-lookup-20261124]
permissions:
  contents: read
  actions: read
jobs:
  primary-key:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        clients: [1, 8]
    env:
      LOOKUP_ROWS: 100000
      LOOKUP_CLIENTS: ${{ matrix.clients }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: ramsql-benchmark-binary
          run-id: 45448387443
          github-token: ${{ github.token }}
          path: .ci-runtime/downloaded-ramsql
      - uses: actions/download-artifact@v4
        with:
          name: loopback-probe
          run-id: 45448387443
          github-token: ${{ github.token }}
          path: .ci-runtime/probe
      - name: Restore the supplied private IRDB Java client
        env:
          IRDB_JDBC_PART_1: ${{ secrets.IRDB_JDBC_PART_1 }}
          IRDB_JDBC_PART_2: ${{ secrets.IRDB_JDBC_PART_2 }}
          IRDB_JDBC_PART_3: ${{ secrets.IRDB_JDBC_PART_3 }}
          IRDB_JDBC_PART_4: ${{ secrets.IRDB_JDBC_PART_4 }}
          IRDB_JDBC_PART_5: ${{ secrets.IRDB_JDBC_PART_5 }}
        run: python ci/bootstrap.py dependencies
      - name: Build the unchanged dbMeter and IRDB adapter
        run: sh build.sh
      - name: Run the original JDBC case with the RAMSQL Linux loopback deployment
        run: |
          chmod 755 .ci-runtime/probe/tcp_loopback_probe
          echo 'RAMSQL uses the indexed Linux socket map with bounded server reply caching for same-host peers only. PostgreSQL uses its original TCP deployment. IRDB uses the same JDBC path and the vendor clustered index on the lookup key. The lookup scoring rules are unchanged.' >> "$GITHUB_STEP_SUMMARY"
          python ci/qualify_loopback_lookup.py .ci-runtime/probe/tcp_loopback_probe "$LOOKUP_CLIENTS" "$LOOKUP_ROWS"
      - name: Score the original case and publish all timing results
        if: always()
        run: python ci/evidence.py suite --suite size-scaling --size-partition "$LOOKUP_ROWS" --lookup-clients "$LOOKUP_CLIENTS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clustered-irdb-100000-row-lookup-${{ matrix.clients }}-clients
          path: reports/live/size-scaling-100000/
          if-no-files-found: error
          retention-days: 30
