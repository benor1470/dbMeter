name: Durable two packed 100M table capacity

on:
  push:
    branches: [bench/ramsql-two-packed-tables-20261118]
  workflow_dispatch:
    inputs:
      runner:
        description: Linux x64 runner label with sufficient RAM and disk for the full lane
        type: string
        default: ubuntu-24.04
      execute_full:
        description: Actually load both 100M tables and recover their original synchronous WAL
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dual-fact:
    name: Two independent integral banks
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      PRODUCT_REVISION: 6eba65f6ea9e99dd648a60a3fb4caa92b1fc9967
      PRODUCT_ARCHIVE_SHA256: c030edeaca34fffd6b3cc612bbedae1d5970ac6bea6bf355cc970aeb1fe60536
      ZPM_REVISION: 2350feeeb580d39623218a46d413b095e54bb615
      ZPM_ARCHIVE_SHA256: 912ab1119d01b0df51221dc682995477a18f8b5e5db9d9c1a0fc7410ac0f050f
      FIXTURE_REVISION: bfdf49a4bf017f65d63590eb4aed0309d0874dce
      FIXTURE_ARCHIVE_SHA256: 7112f0f063e02a5474f7e14aa4bb81ba354d60ef5ed5d27831c3def85b446c8b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SB0LTD/ramsql
          ref: ${{ env.PRODUCT_REVISION }}
          path: product
      - uses: actions/checkout@v4
        with:
          repository: SB0LTD/ramsql
          ref: ${{ env.FIXTURE_REVISION }}
          path: fixture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified native compiler and source pins
        run: |
          set -euo pipefail
          test "$RUNNER_OS/$RUNNER_ARCH" = Linux/X64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_REVISION"
          test "$(git -C fixture rev-parse HEAD)" = "$FIXTURE_REVISION"
          mkdir -p evidence "$RUNNER_TEMP/sig-toolchain"
          verify_archive() {
            local url="$1" sha="$2" output="$3"
            curl --fail --location --retry 3 "$url" --output "$output"
            printf '%s  %s\n' "$sha" "$output" | sha256sum --check --strict -
          }
          verify_archive "https://github.com/SB0LTD/ramsql/archive/$PRODUCT_REVISION.tar.gz" \
            "$PRODUCT_ARCHIVE_SHA256" "$RUNNER_TEMP/product.tar.gz"
          verify_archive "https://github.com/SB0LTD/zpm/archive/$ZPM_REVISION.tar.gz" \
            "$ZPM_ARCHIVE_SHA256" "$RUNNER_TEMP/zpm.tar.gz"
          verify_archive "https://github.com/SB0LTD/ramsql/archive/$FIXTURE_REVISION.tar.gz" \
            "$FIXTURE_ARCHIVE_SHA256" "$RUNNER_TEMP/fixture.tar.gz"
          python product/tools/release_matrix.py --compiler-host "$RUNNER_OS/$RUNNER_ARCH" > evidence/compiler-release.json
          read -r tag asset expected < <(python -c 'import json; p=json.load(open("evidence/compiler-release.json")); print(p["tag"], p["asset"], p["sha256"])')
          archive="$RUNNER_TEMP/$asset"
          verify_archive "https://github.com/SB0LTD/sig/releases/download/$tag/$asset" "$expected" "$archive"
          tar -xf "$archive" -C "$RUNNER_TEMP/sig-toolchain"
          compiler="$(find "$RUNNER_TEMP/sig-toolchain" -type f -path '*/bin/sig' -print -quit)"
          test -x "$compiler"
          lib="$(dirname "$(dirname "$compiler")")/lib"
          test -f "$lib/std/std.sig"
          printf 'SIG=%s\nSIG_LIB_DIR=%s\n' "$compiler" "$lib" >> "$GITHUB_ENV"
      - name: Prepare the source-pinned Sig runtime
        run: |
          set -euo pipefail
          python product/tools/prepare_sig_runtime.py --installed-lib "$SIG_LIB_DIR" \
            --output "$RUNNER_TEMP/sig-runtime" --github-env "$GITHUB_ENV"
      - name: Build exact packed external storage variant
        run: |
          set -euo pipefail
          "$SIG" version | tee evidence/sig-version.txt
          (cd product; "$SIG" build -Doptimize=ReleaseSafe -Dintegral-version-banks=true -Dcompact-version-stamps=true) \
            2>&1 | tee evidence/build.txt
          install -m 755 product/sig-out/bin/ramsql evidence/ramsql
          cp "$SIG_RUNTIME_PREPARATION" evidence/runtime-preparation.json
          PYTHONPATH=product/tools python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from package_release import dependency_provenance

          def digest(path):
              with Path(path).open("rb") as handle:
                  return hashlib.file_digest(handle, "sha256").hexdigest()

          zpm = dependency_provenance()
          expected = f"https://github.com/SB0LTD/zpm/archive/{os.environ['ZPM_REVISION']}.tar.gz"
          assert zpm == {"archive": expected, "sha256": os.environ["ZPM_ARCHIVE_SHA256"]}
          keys = ("PRODUCT_REVISION", "PRODUCT_ARCHIVE_SHA256", "FIXTURE_REVISION",
                  "FIXTURE_ARCHIVE_SHA256", "GITHUB_SHA", "GITHUB_REPOSITORY", "GITHUB_RUN_ID")
          result = {key.lower(): os.environ[key] for key in keys}
          result.update(zpm=zpm, binary_sha256=digest("evidence/ramsql"),
                        harness_sha256=digest(".github/fixtures/two_packed_tables.py"),
                        process_fixture_sha256=digest("fixture/tools/test_persistence.py"),
                        flags=["-Doptimize=ReleaseSafe", "-Dintegral-version-banks=true", "-Dcompact-version-stamps=true"])
          Path("evidence/provenance.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Plan 100M rows in each table without opening a database
        run: |
          set -euo pipefail
          df -B1 "$RUNNER_TEMP" | tee evidence/disk.txt
          python .github/fixtures/two_packed_tables.py --binary evidence/ramsql \
            --wal "$RUNNER_TEMP/two-packed-full.wal" --report evidence/full-capacity.json
          python - <<'PY'
          import json
          import os
          with open("evidence/full-capacity.json", encoding="utf-8") as handle:
              r = json.load(handle)
          assert r["mode"] == "preflight" and r["rows_per_table"] == 100_000_000 and not r["stress_passed"]
          assert r["minimum_two_bank_bytes"] == 15_494_967_376
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print("## Two 100M-row packed tables", file=summary)
              print(f"- Native planned peak region bytes **{r['peak_server_regions_bytes']:,}**", file=summary)
              print(f"- Sampled grant **{r['machine_capacity']['new_region_bytes']:,}**", file=summary)
              print(f"- Memory admitted **{r['memory_admitted']}**. Disk admitted **{r['disk_admitted']}**.", file=summary)
              print("- This preflight opens no database and loads no rows.", file=summary)
          PY
      - name: Exercise the helper on a separate 262144-row-per-table sample
        if: ${{ !inputs.execute_full }}
        env:
          PYTHONPATH: fixture/tools
        run: |
          set -euo pipefail
          python -m pip install -r fixture/tools/requirements-test.txt
          python .github/fixtures/two_packed_tables.py --binary evidence/ramsql --execute --smoke \
            --wal "$RUNNER_TEMP/two-packed-smoke.wal" --report evidence/smoke.json
      - name: Load and recover exactly two 100M-row tables
        if: ${{ inputs.execute_full }}
        env:
          PYTHONPATH: fixture/tools
        run: |
          set -euo pipefail
          python -m pip install -r fixture/tools/requirements-test.txt
          python .github/fixtures/two_packed_tables.py --binary evidence/ramsql --execute \
            --wal "$RUNNER_TEMP/two-packed-full.wal" --report evidence/full-stress.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-packed-durable-evidence
          path: evidence/
          if-no-files-found: error
