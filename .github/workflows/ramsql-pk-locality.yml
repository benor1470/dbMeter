name: RAMSQL prepared lookup locality diagnostic

on:
  push:
    branches: [ci/qualified-main-pk-locality-20261118]

permissions:
  contents: read

jobs:
  locality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build verified RAMSQL and the original dbMeter harness
        run: |
          python ci/bootstrap.py ramsql
          mv .ci-runtime/ramsql .ci-runtime/ramsql-provenance.json "$RUNNER_TEMP"/
          mkdir .ci-runtime/downloaded-ramsql
          mv "$RUNNER_TEMP/ramsql" "$RUNNER_TEMP/ramsql-provenance.json" .ci-runtime/downloaded-ramsql/
          sh build.sh
      - name: Record owned scheduler and TCP activity on original JDBC lookups
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y linux-tools-generic
          packages=$(dpkg-query -W -f='${binary:Package}\n' 'linux-tools-[0-9]*')
          perf_binary=$(dpkg-query -L $packages | awk '/^\/usr\/lib\/.*\/perf$/ {print}' | sort -V | tail -n 1)
          test -x "$perf_binary"
          command -v ss
          "$perf_binary" version
          python ci/profile_prepared_locality.py "$perf_binary"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-lookup-locality
          path: reports/live/size-scaling-1000000/
          if-no-files-found: error
          retention-days: 30
